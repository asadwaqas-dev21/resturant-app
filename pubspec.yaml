name: restaurant_os_ai
description: "RestaurantOS AI white-label restaurant SaaS starter."

publish_to: 'none' 



version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  iconsax: ^0.0.8
  intl: ^0.20.2
  supabase_flutter: ^2.14.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/aaplogo.jpeg"
  web:
    generate: true
    image_path: "assets/aaplogo.jpeg"
  windows:
    generate: true
    image_path: "assets/aaplogo.jpeg"

flutter:

  uses-material-design: true

  assets:
    - assets/aaplogo.jpeg

 
